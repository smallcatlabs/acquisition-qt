name: Build & Package (macOS)

# Called by release.yml on a version tag (RELEASE.md), or run by hand. It
# builds, tests and packages; it never creates a release.
on:
  workflow_call:
    inputs:
      runner:
        description: 'github or laptop, as for workflow_dispatch below.'
        type: string
        default: github
  workflow_dispatch:
    inputs:
      runner:
        description: 'github: a GitHub-hosted Mac. laptop: the maintainer''s one-job VM (label smallcat-macos), started by hand.'
        type: choice
        options: [github, laptop]
        default: github

permissions:
  contents: read

jobs:
  build-macos-dmg:
    # A tag push always builds on a GitHub-hosted Mac. When GitHub cannot
    # allocate one, the maintainer starts Release (or this workflow) by hand
    # on the tag with runner=laptop and starts a throwaway macOS VM that takes
    # this one job (BUILD.md, "Platform Notes"). That VM has Qt 6.11.3
    # installed and sets QT_ROOT_DIR, so Setup Qt is skipped there.
    runs-on: ${{ inputs.runner == 'laptop' && fromJSON('["self-hosted","macOS","ARM64","smallcat-macos"]') || 'macos-latest' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 0

    - name: Get version
      id: version
      run: .github/scripts/version.sh

    - name: Setup Qt
      if: inputs.runner != 'laptop'
      uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
      with:
        version: '6.11.3'
        modules: 'qtnetworkauth'
        cache: true
        cache-key-prefix: 'qt-6.11.3-macos'

    - name: Check the laptop VM's Qt
      if: inputs.runner == 'laptop'
      run: |
        test -x "$QT_ROOT_DIR/bin/macdeployqt" || { echo "::error::QT_ROOT_DIR is not set to a Qt install"; exit 1; }
        grep -q '6.11.3' <<<"$QT_ROOT_DIR" || { echo "::error::expected Qt 6.11.3, got $QT_ROOT_DIR"; exit 1; }

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --parallel 3

    - name: Test
      run: ctest --test-dir build --output-on-failure

    # The dSYM is produced by dsymutil in a POST_BUILD step in CMakeLists.txt.
    # Uploading before macdeployqt is fine: install_name_tool rewrites load
    # commands but leaves LC_UUID, which is what Sentry matches on.
    - name: Upload debug symbols to Sentry
      uses: ./.github/actions/sentry-symbols
      with:
        paths: >-
          build/acquisition_${{ steps.version.outputs.version }}.dSYM
          build/acquisition.app/Contents/MacOS/acquisition
        org: ${{ vars.SENTRY_ORG }}
        project: acquisition
        auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}

    - name: Package DMG
      run: |
        "$QT_ROOT_DIR/bin/macdeployqt" \
          build/acquisition.app \
          -verbose=2 \
          -always-overwrite \
          -appstore-compliant \
          -dmg

    - name: Rename DMG
      run: |
        mv build/acquisition.dmg \
          "build/Acquisition_${{ steps.version.outputs.version }}_arm64.dmg"

    - name: Upload DMG artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: Acquisition_${{ steps.version.outputs.version }}_arm64.dmg
        path: build/Acquisition_*.dmg
        retention-days: 30

    - name: Upload debug symbols artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: Acquisition_${{ steps.version.outputs.version }}_arm64.dSYM
        path: build/acquisition*.dSYM
        retention-days: 30
