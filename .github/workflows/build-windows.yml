name: Build & Package (Windows)

# Builds, tests and packages the Windows release artifacts and uploads them as
# workflow artifacts. It does not publish anything: release.yml calls it on a
# version tag, and its release job creates the draft from these artifacts.
# Dispatch it by hand to build one platform on its own.
on:
  workflow_call:
    outputs:
      version:
        description: APP_VERSION_STRING of the build.
        value: ${{ jobs.build-windows-installer.outputs.version }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 0

    - name: Setup Qt
      uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
      with:
        version: '6.12.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtnetworkauth'
        aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8d961e61720b3c06583517fbc68d57ec0a4e9f95'
        cache: true
        cache-key-prefix: 'qt-6.12.0-win64-aqt-master'

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: x64

    - name: Configure CMake
      run: |
        cmake -B build -S . `
          -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

    - name: Build
      run: cmake --build build --config Release --parallel 4

    - name: Test
      run: ctest --test-dir build --output-on-failure

    - name: Get version
      id: version
      run: |
        $header = Get-Content "build\version_defines.h" -Raw
        if ($header -notmatch '#define APP_VERSION_STRING\s+"([^"]+)"') {
          throw "Could not read APP_VERSION_STRING from build\version_defines.h"
        }
        $version = $matches[1]

        # The update checker parses APP_VERSION_STRING as the running version and
        # compares it against github release tags (src/util/updatechecker.cpp),
        # so a tag that disagrees with the build would tell every user to update
        # to the version they are already running, on every check.
        if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
          Write-Host "::error::Tag $env:GITHUB_REF_NAME does not match APP_VERSION_STRING $version"
          Write-Host "::error::Update app_version / app_version_suffix in CMakeLists.txt"
          exit 1
        }
        echo "version=$version" >> $env:GITHUB_OUTPUT

    - name: Upload debug symbols to Sentry
      uses: ./.github/actions/sentry-symbols
      with:
        paths: build/acquisition.pdb build/acquisition.exe
        org: ${{ vars.SENTRY_ORG }}
        project: acquisition
        auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}

    - name: Prepare deployment
      run: |
        $deploy = "build\deploy"
        New-Item -ItemType Directory -Force -Path $deploy

        # Copy executables (crashpad_handler is copied next to acquisition by CMake post-build)
        Copy-Item "build\acquisition.exe" $deploy
        Copy-Item "build\crashpad_handler.exe" $deploy

        # Deploy Qt runtime dependencies
        & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
          --release `
          --compiler-runtime `
          --no-translations `
          --dir $deploy `
          "$deploy\acquisition.exe"

        # windeployqt --compiler-runtime is the authority for this prerequisite.
        # Fail packaging if it did not provide a valid Microsoft-signed installer.
        $redist = "$deploy\vc_redist.x64.exe"
        if (-not (Test-Path -LiteralPath $redist)) {
          throw "windeployqt did not package vc_redist.x64.exe"
        }

        $signature = Get-AuthenticodeSignature -LiteralPath $redist
        if ($signature.Status -ne 'Valid' -or
            $null -eq $signature.SignerCertificate -or
            $signature.SignerCertificate.Subject -notmatch
              '(^|,\s*)O=Microsoft Corporation(,|$)') {
          throw "vc_redist.x64.exe does not have a valid Microsoft signature"
        }

    - name: Install Inno Setup
      run: |
        # Installed via chocolatey, pinned: the jrsoftware.org download.php
        # URL has served an HTML page instead of the installer (observed
        # July 2026), which silently produced a corrupt innosetup.exe.
        choco install innosetup --version=6.7.1 -y --no-progress
        echo "${env:ProgramFiles(x86)}\Inno Setup 6" >> $env:GITHUB_PATH

    - name: Build installer
      run: |
        & ISCC.exe /DBUILD_DIR="build" /DDEPLOY_DIR="build\deploy" "installer.iss"

    - name: Name the pdb for distribution
      run: |
        # Every release shipped its symbols as a plain 'acquisition.pdb', so two
        # of them collide in a download folder and a stray copy cannot be traced
        # back to a build. Copy rather than rename: the linker's own name is what
        # the PE records, and local debuggers look the pdb up by that name.
        Copy-Item "build\acquisition.pdb" `
          "build\acquisition-${{ steps.version.outputs.version }}.pdb"

    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: acquisition-installer-${{ steps.version.outputs.version }}
        path: |
          Output/*.exe
          build/acquisition-${{ steps.version.outputs.version }}.pdb
        retention-days: 30
