name: Build & Package (Windows)

# Called by release.yml on a version tag (RELEASE.md), or run by hand. It
# builds, tests and packages; it never creates a release.
on:
  workflow_call:
    outputs:
      version:
        description: 'The version this build calls itself.'
        value: ${{ jobs.build-windows-installer.outputs.version }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 0

    - name: Get version
      id: version
      shell: bash
      run: .github/scripts/version.sh

    # Every workflow installs the same Qt (BUILD.md). Not 6.12.0: a 6.12.0
    # Windows package failed at start-up with "SSL support is missing" on a
    # user's machine, while its TLS backend works on this runner (#370), so
    # the TLS check below would not catch that failure here.
    - name: Setup Qt
      uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
      with:
        version: '6.11.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtnetworkauth'
        aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8d961e61720b3c06583517fbc68d57ec0a4e9f95'
        cache: true
        cache-key-prefix: 'qt-6.11.3-win64-aqt-master'

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: x64

    - name: Configure CMake
      run: |
        cmake -B build -S . `
          -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

    - name: Build
      run: cmake --build build --config Release --parallel 4

    - name: Test
      run: ctest --test-dir build --output-on-failure

    - name: Upload debug symbols to Sentry
      uses: ./.github/actions/sentry-symbols
      with:
        paths: build/acquisition.pdb build/acquisition.exe
        org: ${{ vars.SENTRY_ORG }}
        project: acquisition
        auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}

    - name: Prepare deployment
      run: |
        $deploy = "build\deploy"
        New-Item -ItemType Directory -Force -Path $deploy

        # Copy executables (crashpad_handler is copied next to acquisition by CMake post-build)
        Copy-Item "build\acquisition.exe" $deploy
        Copy-Item "build\crashpad_handler.exe" $deploy

        # Deploy Qt runtime dependencies
        & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
          --release `
          --compiler-runtime `
          --no-translations `
          --dir $deploy `
          "$deploy\acquisition.exe"

        # windeployqt --compiler-runtime is the authority for this prerequisite.
        # Fail packaging if it did not provide a valid Microsoft-signed installer.
        $redist = "$deploy\vc_redist.x64.exe"
        if (-not (Test-Path -LiteralPath $redist)) {
          throw "windeployqt did not package vc_redist.x64.exe"
        }

        $signature = Get-AuthenticodeSignature -LiteralPath $redist
        if ($signature.Status -ne 'Valid' -or
            $null -eq $signature.SignerCertificate -or
            $signature.SignerCertificate.Subject -notmatch
              '(^|,\s*)O=Microsoft Corporation(,|$)') {
          throw "vc_redist.x64.exe does not have a valid Microsoft signature"
        }

    - name: Check TLS in the package
      run: |
        # The packaged binary reports the TLS backends it finds and exits 1
        # when none supports SSL (#370). The Qt install is hidden from it
        # (install-qt-action puts its bin on PATH and sets QT_PLUGIN_PATH), so
        # only what windeployqt packaged can be found.
        $deploy = Resolve-Path "build\deploy"
        Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
        $env:PATH = ($env:PATH -split ';' |
          Where-Object { $_ -and -not $_.StartsWith($env:QT_ROOT_DIR) }) -join ';'
        $data = Join-Path $env:RUNNER_TEMP "tls-check-data"

        function Invoke-TlsCheck {
          $out = Join-Path $env:RUNNER_TEMP "tls-check-out.txt"
          $err = Join-Path $env:RUNNER_TEMP "tls-check-err.txt"
          $p = Start-Process -FilePath "$deploy\acquisition.exe" `
            -ArgumentList '--check-tls', '--data-dir', "`"$data`"" `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          Get-Content $out, $err | Out-Host
          return $p.ExitCode
        }

        $code = Invoke-TlsCheck
        if ($code -ne 0) {
          throw "The packaged application has no TLS backend that supports SSL (exit $code)"
        }

        # Negative control: without the packaged TLS plugins the same check
        # must fail, or a pass above proves nothing.
        Rename-Item "$deploy\tls" "tls.hidden"
        try {
          $code = Invoke-TlsCheck
        } finally {
          Rename-Item "$deploy\tls.hidden" "tls"
        }
        if ($code -eq 0) {
          throw "The TLS check passed with the TLS plugins removed; it would not catch a package without them"
        }

    - name: Install Inno Setup
      run: |
        # Installed via chocolatey, pinned: the jrsoftware.org download.php
        # URL has served an HTML page instead of the installer (observed
        # July 2026), which silently produced a corrupt innosetup.exe.
        choco install innosetup --version=6.7.1 -y --no-progress
        echo "${env:ProgramFiles(x86)}\Inno Setup 6" >> $env:GITHUB_PATH

    - name: Build installer
      run: |
        & ISCC.exe /DBUILD_DIR="build" /DDEPLOY_DIR="build\deploy" "installer.iss"

    - name: Check the installer over a stale install
      run: |
        # Setup must leave nothing behind from an older package. A TLS plugin
        # that Qt finds but cannot load stops it loading the schannel plugin,
        # and start-up then reports "SSL support is missing" (#440). The
        # package check above cannot see this: it runs in a fresh folder.
        $deploy = Resolve-Path "build\deploy"
        Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
        $env:PATH = ($env:PATH -split ';' |
          Where-Object { $_ -and -not $_.StartsWith($env:QT_ROOT_DIR) }) -join ';'
        $data = Join-Path $env:RUNNER_TEMP "stale-check-data"
        $stale = Join-Path $env:RUNNER_TEMP "stale-install"
        Copy-Item $deploy $stale -Recurse

        # The stale plugin: the schannel plugin under the name of the OpenSSL
        # one that older packages shipped, with its import of Qt6Network.dll
        # broken. Qt reads its metadata, so it tries to load it, and fails.
        $bytes = [IO.File]::ReadAllBytes("$stale\tls\qschannelbackend.dll")
        $text = [Text.Encoding]::GetEncoding(28591).GetString($bytes)
        $at = $text.IndexOf('Qt6Network.dll')
        if ($at -lt 0) {
          throw "qschannelbackend.dll does not import Qt6Network.dll by that name"
        }
        $bytes[$at + 6] = [byte][char]'_'
        [IO.File]::WriteAllBytes("$stale\tls\qopensslbackend.dll", $bytes)
        # Files of the other kinds older packages left behind.
        Copy-Item "$stale\Qt6Core.dll" "$stale\Qt6Stale.dll"
        New-Item -ItemType Directory "$stale\bearer" | Out-Null
        Copy-Item "$stale\Qt6Core.dll" "$stale\bearer\qgenericbearer.dll"
        # And one that is not the application's, which Setup must leave alone.
        Set-Content "$stale\not-ours.txt" "kept"

        function Invoke-TlsCheck {
          $out = Join-Path $env:RUNNER_TEMP "stale-check-out.txt"
          $err = Join-Path $env:RUNNER_TEMP "stale-check-err.txt"
          $p = Start-Process -FilePath "$stale\acquisition.exe" `
            -ArgumentList '--check-tls', '--data-dir', "`"$data`"" `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          Get-Content $out, $err | Out-Host
          return $p.ExitCode
        }

        # Control: the stale plugin must break TLS before Setup runs, or a
        # pass afterwards proves nothing.
        $code = Invoke-TlsCheck
        if ($code -eq 0) {
          throw "The stale TLS plugin did not break the TLS check; this step would not catch a leftover plugin"
        }

        $setup = Get-ChildItem "Output\*_setup_*.exe" | Select-Object -First 1
        $log = Join-Path $env:RUNNER_TEMP "stale-install-setup.log"
        $p = Start-Process -FilePath $setup.FullName -Wait -PassThru -ArgumentList `
          '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', `
          "/DIR=`"$stale`"", "/LOG=`"$log`""
        if ($p.ExitCode -ne 0) {
          Get-Content $log | Out-Host
          throw "Setup failed over the stale install (exit $($p.ExitCode))"
        }

        $code = Invoke-TlsCheck
        if ($code -ne 0) {
          throw "After installing over a stale install the application has no TLS backend that supports SSL (exit $code)"
        }
        foreach ($left in 'tls\qopensslbackend.dll', 'Qt6Stale.dll', 'bearer') {
          if (Test-Path "$stale\$left") {
            throw "Setup left $left behind"
          }
        }
        if (-not (Test-Path "$stale\not-ours.txt")) {
          throw "Setup removed a file that is not the application's"
        }

    - name: Name the pdb for its version
      run: |
        # A plain 'acquisition.pdb' cannot be told from another build's once
        # downloaded. Copy rather than rename: the linker's own name is what the
        # PE records, and local debuggers look the pdb up by that name. The pdb
        # stays a workflow artifact and in Sentry; releases do not carry it
        # (RELEASE.md).
        Copy-Item "build\acquisition.pdb" `
          "build\acquisition-${{ steps.version.outputs.version }}.pdb"

    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: acquisition-installer-${{ steps.version.outputs.version }}
        path: |
          Output/*.exe
          build/acquisition-${{ steps.version.outputs.version }}.pdb
        retention-days: 30
