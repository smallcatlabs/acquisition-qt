name: Tests

# Builds everything and runs the whole CTest suite on every pull request and
# on every push to master. Before this workflow the suite ran only in the
# release workflows, on a version tag, so a broken test on master was first
# seen when a release was cut.
#
# One platform (Linux) keeps the check fast enough to be required; the three
# release workflows still build and test each platform on a tag. A second job
# builds and tests on Windows and is not required: it reports, and does not
# gate a merge (#379).
#
# The build uses the `release` preset from CMakePresets.json, the same one
# documented for local use in BUILD.md, so this job and a developer's tree are
# the same recipe.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Picks where the Linux build runs (BUILD.md, "Where CI runs"): the
  # project's own runner pool, or ubuntu-latest. The pool writes the time into
  # the organization variable SMALLCAT_LINUX_POOL every minute while it is up,
  # and `off` when it is stopped. A pull request from a fork or from
  # Dependabot always builds on ubuntu-latest, and so does every run while that
  # time is missing or more than five minutes old. This job must not fail: a
  # required check whose `needs` failed is skipped, and a skipped check can
  # pass. Anything unexpected picks ubuntu-latest.
  route:
    name: Pick Linux runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs-on: ${{ steps.pick.outputs.runs-on }}
    steps:
      - name: Pick runner
        id: pick
        env:
          HEARTBEAT: ${{ vars.SMALLCAT_LINUX_POOL }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          hosted='"ubuntu-latest"'
          pool='["self-hosted","smallcat-linux"]'
          max_age=300
          now=$(date +%s)
          if [ "$FORK" = true ]; then
            runs_on=$hosted why='a pull request from a fork'
          elif [ "$PR_AUTHOR" = 'dependabot[bot]' ]; then
            runs_on=$hosted why='a pull request from Dependabot'
          elif ! [[ $HEARTBEAT =~ ^[1-9][0-9]{0,11}$ ]]; then
            runs_on=$hosted why='the pool is off (SMALLCAT_LINUX_POOL is not a time)'
          elif (( now - HEARTBEAT > max_age )); then
            runs_on=$hosted why="the pool was last heard from $(( (now - HEARTBEAT) / 60 )) minutes ago"
          else
            runs_on=$pool why="the pool was heard from $(( now - HEARTBEAT )) seconds ago"
          fi
          echo "runs-on=$runs_on" >> "$GITHUB_OUTPUT"
          where=$([ "$runs_on" = "$pool" ] && echo 'the smallcat runner pool' || echo 'ubuntu-latest')
          echo "Linux build runs on $where: $why." | tee -a "$GITHUB_STEP_SUMMARY"

  ctest:
    name: Build + CTest (Linux)
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runs-on) }}
    timeout-minutes: 60
    env:
      # Bound the saved cache; past this ccache evicts least-recently-used objects.
      CCACHE_MAXSIZE: 1G
      # The pool's runner image carries Qt too; "Check runner image"
      # compares it, so the workflow stays the one place it is pinned.
      # clang-format is pinned in pyproject.toml.
      QT_VERSION: 6.11.3

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # pyproject.toml is the one place the clang-format version is pinned.
      - name: Read the clang-format pin
        run: |
          version=$(sed -n 's/^ *"clang-format==\([0-9.]*\)",$/\1/p' pyproject.toml)
          if [ -z "$version" ]; then
            echo "::error::pyproject.toml pins no clang-format version."
            exit 1
          fi
          echo "CLANG_FORMAT_VERSION=$version" >> "$GITHUB_ENV"

      # On the pool, Qt, the apt packages, the locale and clang-format are in
      # the runner image, and the job has no sudo; the steps that install them
      # run on GitHub-hosted runners only. This fails at once, naming both
      # versions, when the image no longer matches the pins (QT_VERSION above,
      # clang-format in pyproject.toml).
      - name: Check runner image
        if: runner.environment == 'self-hosted'
        run: |
          echo "Runner $RUNNER_NAME, image $(grep -m1 '^sealed_utc=' /etc/smallcat-runner-image | cut -d= -f2)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          fail=0
          qt=$("$QT_ROOT_DIR/bin/qmake" -query QT_VERSION 2>/dev/null || echo none)
          if [ "$qt" != "$QT_VERSION" ]; then
            echo "::error::The runner image has Qt $qt; this workflow wants $QT_VERSION."
            fail=1
          fi
          if ! clang-format --version | grep -qF "version ${CLANG_FORMAT_VERSION}"; then
            echo "::error::The runner image has $(clang-format --version 2>&1 | head -n1); pyproject.toml pins ${CLANG_FORMAT_VERSION}."
            fail=1
          fi
          if ! locale -a | grep -qiE '^de_DE\.utf-?8$'; then
            echo "::error::The runner image has no de_DE.UTF-8 locale."
            fail=1
          fi
          if [ "$fail" = 1 ]; then
            echo "::error::Refresh the runner image, or stop the runner pool to build on ubuntu-latest."
            exit 1
          fi

      # Every first-party C++ file carries a licence line (BUILD.md,
      # "Formatting"); list the ones that do not.
      - name: Check licence lines
        run: |
          missing=$(git grep -L 'SPDX-License-Identifier:' -- \
            'src/*.cpp' 'src/*.h' 'tests/*.cpp' 'tests/*.h' tests/CMakeLists.txt || true)
          if [ -n "$missing" ]; then
            echo "::error::These files have no SPDX-License-Identifier line:"
            echo "$missing"
            exit 1
          fi

      # Formatting depends on the clang-format version, so the version is
      # pinned (BUILD.md, "Formatting"). Runs first so a formatting slip fails
      # in seconds, before the build.
      - name: Setup uv
        if: runner.environment == 'github-hosted'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Install clang-format
        if: runner.environment == 'github-hosted'
        run: |
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          clang-format --version | grep -F "version ${CLANG_FORMAT_VERSION}"
          git ls-files -z 'src/*.cpp' 'src/*.h' 'tests/*.cpp' 'tests/*.h' \
            | xargs -0 clang-format --dry-run -Werror

      - name: Setup Qt
        if: runner.environment == 'github-hosted'
        # Normally 30 to 75 seconds; see sanitizers.yml for why this is capped.
        timeout-minutes: 5
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtnetworkauth'
          cache: true
          cache-key-prefix: 'qt-${{ env.QT_VERSION }}-linux-tests'

      - name: Install dependencies
        if: runner.environment == 'github-hosted'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            openssl \
            libcurl4-openssl-dev \
            libgl-dev \
            libssl-dev \
            libvulkan-dev \
            libxcb-cursor0 \
            libxcb-cursor-dev \
            locales \
            zlib1g-dev
          # tst_item reads mod values under a decimal-comma LC_NUMERIC (#132);
          # the Test step sets ACQ_REQUIRE_COMMA_LOCALE so that test fails,
          # rather than skips, if this locale is missing.
          sudo locale-gen de_DE.UTF-8

      # The compiler cache is what makes this job cheap after its first run:
      # the fetched dependencies (sentry-native with crashpad, QXlsx, QCoro,
      # spdlog) are most of a cold build and almost never change. The pool's
      # runner image carries a warm cache at the same path, so a pool run
      # skips this rather than move up to 1 GB each way.
      - name: Restore compiler cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ccache
          key: ccache-tests-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-tests-${{ runner.os }}-

      # ACQ_WERROR makes a warning in first-party code fail the pull request.
      # Release builds leave it off, so a newer compiler there only warns.
      # On the pool, the runner image sets SMALLCAT_CMAKE_TOP_LEVEL_INCLUDES
      # to a CMake dependency provider that builds the FetchContent
      # dependencies from copies in the image when it holds that exact
      # repository and tag, and lets CMake download any other. Elsewhere the
      # variable is unset and this adds nothing.
      - name: Configure
        run: >
          cmake --preset release
          -DACQ_WERROR=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ${SMALLCAT_CMAKE_TOP_LEVEL_INCLUDES:+"-DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=$SMALLCAT_CMAKE_TOP_LEVEL_INCLUDES"}

      # Three wide: the heavy C++23/Qt translation units use enough memory
      # that the runner's four cores cannot all take one at a time safely.
      - name: Build
        run: cmake --build --preset release --parallel 3

      - name: Compiler cache statistics
        run: ccache --show-stats

      # Window tests save screenshots into ACQ_TEST_SCREENSHOT_DIR (BUILD.md,
      # "Window tests"), and one named "failed" when a test fails; the directory
      # is kept with a failed run.
      - name: Test
        env:
          ACQ_REQUIRE_COMMA_LOCALE: '1'
          ACQ_TEST_SCREENSHOT_DIR: ${{ github.workspace }}/build/test-screenshots
        run: ctest --preset release

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-screenshots
          path: build/test-screenshots
          if-no-files-found: ignore
          retention-days: 14

  # Windows on every pull request, advisory (#379): master's Windows build
  # was once broken from #327 until #352 with no check showing it. The
  # branch ruleset does not require this job, so a failure here shows
  # red and blocks nothing. The steps are build-windows.yml's up to its tests,
  # with the `release` preset and without packaging or Sentry.
  ctest-windows:
    name: Build + CTest (Windows, advisory)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Bound the saved cache; past this ccache evicts least-recently-used objects.
      CCACHE_MAXSIZE: 1G
      # By default ccache tells one compiler from another by cl.exe's size
      # and modification time. GitHub rebuilds the runner image weekly, and
      # while image 20261123 rolled out every run on it had no cache hits,
      # with the same MSVC version as the image before. Compare the
      # compiler's contents instead, so that only a new compiler empties the
      # cache.
      CCACHE_COMPILERCHECK: content

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The same Qt, from the same cache, as build-windows.yml.
      - name: Setup Qt
        timeout-minutes: 10
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.11.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtnetworkauth'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8d961e61720b3c06583517fbc68d57ec0a4e9f95'
          cache: true
          cache-key-prefix: 'qt-6.11.3-win64-aqt-master'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      # The compiler cache is what makes this job cheap after its first run,
      # as in the Linux job: without it every run compiles all of the
      # application, the tests and the fetched dependencies from nothing.
      # ccache comes from its own release page at a pinned version, checked
      # against a pinned hash. A different version shares none of the saved
      # cache: when this step installed from Chocolatey and its feed was
      # down, the job carried on with an older ccache already on the runner
      # and compiled everything again. A failed download fails the step.
      - name: Install ccache
        timeout-minutes: 5
        env:
          CCACHE_VERSION: 4.14.3
          CCACHE_SHA256: c845c3d65be81954c75659145a522a793a27586bf940c5dcfe18af33fa1a67dd
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "ccache-$env:CCACHE_VERSION-windows-x86_64"
          $zip = "$env:RUNNER_TEMP\$name.zip"
          curl.exe --fail --silent --show-error --location --retry 5 --retry-all-errors `
            --output $zip "https://github.com/ccache/ccache/releases/download/v$env:CCACHE_VERSION/$name.zip"
          if ($LASTEXITCODE -ne 0) { throw "ccache download failed" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:CCACHE_SHA256) { throw "ccache download has SHA-256 $hash, expected $env:CCACHE_SHA256" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ccache-bin"
          $exe = "$env:RUNNER_TEMP\ccache-bin\$name\ccache.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "ccache does not run" }
          "CCACHE_EXE=$($exe -replace '\\', '/')" >> $env:GITHUB_ENV
          "CCACHE_DIR=$env:RUNNER_TEMP\ccache" >> $env:GITHUB_ENV

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-tests-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-tests-${{ runner.os }}-

      # No ACQ_WERROR: first-party code has never been held to no warnings
      # under MSVC, and this job is to show a broken build, not a new warning.
      # ACQ_MSVC_EMBEDDED_DEBUG_INFO: the cache cannot store a compile that
      # uses /Zi (CMakeLists.txt, "Platform-specific section").
      - name: Configure
        run: >
          cmake --preset release
          -G Ninja
          -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"
          -DCMAKE_C_COMPILER_LAUNCHER="${{ env.CCACHE_EXE }}"
          -DCMAKE_CXX_COMPILER_LAUNCHER="${{ env.CCACHE_EXE }}"
          -DACQ_MSVC_EMBEDDED_DEBUG_INFO=ON

      - name: Build
        run: cmake --build --preset release --parallel 4

      - name: Compiler cache statistics
        run: '& $env:CCACHE_EXE --show-stats --verbose'

      # On Windows the offscreen platform finds no fonts by itself and draws
      # every letter as an empty box; QT_QPA_FONTDIR gives it the system's, so
      # that a screenshot kept with a failed run can be read.
      - name: Test
        env:
          ACQ_TEST_SCREENSHOT_DIR: ${{ github.workspace }}/build/test-screenshots
          QT_QPA_FONTDIR: C:\Windows\Fonts
        run: ctest --preset release

      - name: Upload test output and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-output-windows
          path: |
            build/test-screenshots
            build/release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14
