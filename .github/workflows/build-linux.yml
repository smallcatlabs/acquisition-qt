name: Build & Package (Linux)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-appimage:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 0

    - name: Setup Qt
      uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
      with:
        version: '6.11.3'
        modules: 'qtnetworkauth'
        cache: true
        cache-key-prefix: 'qt-6.11.3-linux'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          patchelf openssl libfuse2 \
          libcurl4-openssl-dev \
          libgl-dev \
          libssl-dev \
          libvulkan-dev \
          libxcb-cursor0 \
          libxcb-cursor-dev \
          zlib1g-dev

    # linuxdeploy is pinned to a dated release and checked against the sha256
    # GitHub records for that asset. linuxdeploy-plugin-qt still comes from
    # the moving `continuous` channel: its only dated release (February 2025)
    # predates the Qt this builds with and GitHub records no digest for it, so there is
    # nothing to check it against yet.
    - name: Download linuxdeploy
      env:
        LINUXDEPLOY_RELEASE: 1-alpha-20251107-1
        LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
      run: |
        curl -sSfL --retry 3 -o linuxdeploy \
          "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_RELEASE}/linuxdeploy-x86_64.AppImage"
        echo "${LINUXDEPLOY_SHA256}  linuxdeploy" | sha256sum -c -
        curl -sSfL --retry 3 -o linuxdeploy-plugin-qt \
          https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
        chmod +x linuxdeploy linuxdeploy-plugin-qt

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --parallel 2

    - name: Test
      run: ctest --test-dir build --output-on-failure

    - name: Get version
      id: version
      run: |
        version=$(grep APP_VERSION_STRING build/version_defines.h | cut -d'"' -f2)
        echo "version=$version"

        # The update checker parses APP_VERSION_STRING as the running version and
        # compares it against github release tags (src/util/updatechecker.cpp),
        # so a tag that disagrees with the build would tell every user to update
        # to the version they are already running, on every check.
        if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match APP_VERSION_STRING $version"
          echo "::error::Update app_version / app_version_suffix in CMakeLists.txt"
          exit 1
        fi

        echo "version=$version" >> "$GITHUB_OUTPUT"

    # build/acquisition is stripped by a POST_BUILD step in CMakeLists.txt and
    # carries the GNU build ID plus .eh_frame unwind data; acquisition.debug
    # carries the DWARF. Sentry needs both, matched by build ID.
    - name: Upload debug symbols to Sentry
      uses: ./.github/actions/sentry-symbols
      with:
        paths: build/acquisition.debug build/acquisition
        org: ${{ vars.SENTRY_ORG }}
        project: acquisition
        auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}

    - name: Package AppImage
      env:
        QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
        LINUXDEPLOY_OUTPUT_VERSION: ${{ steps.version.outputs.version }}
        LINUXDEPLOY_EXCLUDED_LIBRARIES: "libqsqlmysql.so;libqsqlmimer.so;libqsqlodbc.so;libqsqlpsql.so;libqsqloci.so;libsqloci.so;libqsqlibase.so"
      run: |
        ./linuxdeploy \
          --appdir AppDir \
          --executable build/acquisition \
          --desktop-file acquisition.desktop \
          --icon-file assets/icons/icon.svg \
          --icon-filename default \
          --plugin qt \
          --output appimage

    - name: Upload AppImage artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: acquisition-${{ steps.version.outputs.version }}-x86_64.AppImage
        path: acquisition*.AppImage
        retention-days: 30

    - name: Upload debug symbols artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: acquisition-${{ steps.version.outputs.version }}-x86_64.debug
        path: build/acquisition.debug
        retention-days: 30

    # Only this workflow creates the Sentry release; the Windows and macOS
    # workflows upload symbols for the same release and would otherwise race
    # to create it three times over.
    - name: Create Sentry release
      if: startsWith(github.ref, 'refs/tags/v') && vars.SENTRY_ORG != ''
      env:
        SENTRY_ORG: ${{ vars.SENTRY_ORG }}
        SENTRY_PROJECT: acquisition
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      run: |
        set -euo pipefail
        if [ -z "${SENTRY_AUTH_TOKEN}" ]; then
          echo "SENTRY_AUTH_TOKEN is not set; skipping Sentry release."
          exit 0
        fi

        # Must match SENTRY_RELEASE in src/main.cpp: APP_NAME "@" APP_VERSION_STRING.
        release="acquisition@${{ steps.version.outputs.version }}"

        # Same pinned release and checksum as .github/actions/sentry-symbols.
        cli="${RUNNER_TEMP}/sentry-cli-Linux-x86_64"
        curl -sSfL --retry 3 -o "${cli}" \
          "https://github.com/getsentry/sentry-cli/releases/download/3.6.2/sentry-cli-Linux-x86_64"
        echo "3a4bbf2c0d06378d4e59b337647483751a0a2b1603db5fd4991847d0cfd6478c  ${cli}" | sha256sum -c -
        chmod +x "${cli}"

        "${cli}" releases new "${release}"
        # Suspect commits need the Sentry GitHub integration; don't fail the
        # release build if it isn't configured.
        "${cli}" releases set-commits "${release}" --auto \
          || echo "::warning::Could not associate commits (is the Sentry GitHub integration set up?)"
        "${cli}" releases finalize "${release}"

    - name: Create draft release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        files: acquisition*.AppImage
        generate_release_notes: true
        draft: true
        prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
