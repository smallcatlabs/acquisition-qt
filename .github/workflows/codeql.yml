name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      # TEMPORARY (November 2026, PR 235): hosted runners use Azure's DNS
      # resolver, which cannot resolve the ubuntu.com package hosts while
      # part of Canonical's DNS is not answering. Point the runner at
      # public resolvers that can. Remove this step once a hosted runner
      # resolves archive.ubuntu.com on its own again.
      - name: Work around the Ubuntu DNS outage (temporary)
        run: |
          iface=$(ip route show default | awk '{print $5; exit}')
          echo "default interface: ${iface}"
          sudo resolvectl dns "${iface}" 1.1.1.1 9.9.9.9
          sudo resolvectl flush-caches
          # Report only: the steps below are what must succeed.
          for host in archive.ubuntu.com azure.archive.ubuntu.com security.ubuntu.com; do
            answer=$(timeout 10 getent ahosts "${host}" | head -1 || true)
            printf '%-28s %s\n' "${host}" "${answer:-NOT RESOLVED}"
          done
          timeout 20 curl -sS -o /dev/null -w 'archive.ubuntu.com over HTTP: %{http_code}\n' \
            http://archive.ubuntu.com/ubuntu/dists/noble/InRelease || true

      - name: Setup Qt
        # Normally 30 to 75 seconds. Without a limit, a runner that cannot
        # resolve the Ubuntu package hosts retries for about 47 minutes
        # (November 2026, PR 235: an upstream DNS failure for ubuntu.com).
        timeout-minutes: 5
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          modules: 'qtnetworkauth'
          cache: true
          cache-key-prefix: 'qt-6.12.0-linux-codeql'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openssl \
            libcurl4-openssl-dev \
            libgl-dev \
            libssl-dev \
            libvulkan-dev \
            libxcb-cursor0 \
            libxcb-cursor-dev \
            zlib1g-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel 2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:c-cpp'
