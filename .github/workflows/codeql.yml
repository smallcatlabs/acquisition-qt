name: CodeQL

# Runs after a change lands, not before: on every push to master, weekly so
# that new queries are applied even when nothing merges, and on demand. A
# pull request is gated by the test suite (tests.yml) alone, which keeps the
# wait for a merge to one job. An alert therefore appears within the hour
# after a merge and points at that merge. master carries a "-dev" version,
# and a release is tagged only from a master commit on which this workflow
# has passed, so nothing is released unscanned.
on:
  push:
    branches: [master]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

# A run in progress on master is allowed to finish, so each merge that
# starts a scan gets its result; only a run still waiting is replaced by a
# newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Qt
        # Normally 30 to 75 seconds. Without a limit, a runner that cannot
        # resolve the Ubuntu package hosts retries for about 47 minutes
        # (November 2026, PR 235: an upstream DNS failure for ubuntu.com).
        timeout-minutes: 5
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          modules: 'qtnetworkauth'
          cache: true
          cache-key-prefix: 'qt-6.12.0-linux-codeql'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openssl \
            libcurl4-openssl-dev \
            libgl-dev \
            libssl-dev \
            libvulkan-dev \
            libxcb-cursor0 \
            libxcb-cursor-dev \
            zlib1g-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel 2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:c-cpp'
