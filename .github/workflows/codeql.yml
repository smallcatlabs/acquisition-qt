name: CodeQL

# Runs on release tags, weekly on master, and on demand. It does not run on
# pull requests or on pushes to master: a scan took 26 to 83 minutes from
# start to result in November 2026 and has raised four alerts in the life of
# the repository, so it is kept out of the path of a merge. A pull request is gated by the test suite (tests.yml)
# alone. A final release is always preceded by a beta or release-candidate
# tag, and is tagged only once that tag's scan has come back clean, so
# nothing is released unscanned. The weekly run applies new queries and
# keeps the alerts for master current between releases.
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

# One run per ref; a run in progress is allowed to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Qt
        # Normally 30 to 75 seconds. Without a limit, a runner that cannot
        # resolve the Ubuntu package hosts retries for about 47 minutes
        # (November 2026, PR 235: an upstream DNS failure for ubuntu.com).
        timeout-minutes: 5
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          modules: 'qtnetworkauth'
          cache: true
          cache-key-prefix: 'qt-6.12.0-linux-codeql'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openssl \
            libcurl4-openssl-dev \
            libgl-dev \
            libssl-dev \
            libvulkan-dev \
            libxcb-cursor0 \
            libxcb-cursor-dev \
            zlib1g-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel 2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:c-cpp'

      # CodeQL files alerts against the ref it scanned; it does not fail the
      # job. Fail it here when that ref has an open alert, so that a green
      # job on a release tag means a clean scan. Dismissed alerts do not
      # count.
      - name: Fail on open alerts
        env:
          GH_TOKEN: ${{ github.token }}
          ALERTS_URL: repos/${{ github.repository }}/code-scanning/alerts?ref=${{ github.ref }}&state=open&per_page=100
        run: |
          open=$(gh api --paginate "$ALERTS_URL" \
            --jq '.[] | "#\(.number) \(.rule.id) \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)"')
          if [ -n "$open" ]; then
            echo "Open code scanning alerts on ${GITHUB_REF}:"
            echo "$open"
            exit 1
          fi
          echo "No open code scanning alerts on ${GITHUB_REF}."
