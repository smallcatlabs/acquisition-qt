name: Sanitizers

# Runs the whole test suite under AddressSanitizer + UndefinedBehaviorSanitizer
# on Linux, and the phase-5 network-redesign full-chain integration runner
# (tst_workerintegration) under LeakSanitizer as well, to enforce I-LEAK-BOUND
# leak-boundedness (docs/design/network-redesign-phase5-verification.md §6).
# ACQ_SANITIZE builds with -fno-sanitize-recover=all, so any UBSan report fails
# its test. Leak detection is off for the rest of the suite: only the runner's
# leaks have been measured and bounded. On Linux,
# -fsanitize=address turns on LeakSanitizer, which runs a leak check at each
# process exit. Every scenario is its own process (acq_add_scenario_test). The
# run is split in two: the shutdown scenarios (i_shut_*, i_leak_bound) leave
# accepted detached-QCoro-frame leaks and run WITH tests/lsan.supp; every other
# scenario must exit leak-clean and runs with NO suppression file, so a leak
# there fails the job even if it falls beneath a suppressed coroutine frame. A
# leak outside the closure in either regime fails the job — that is the
# enforcement.
#
# Test/CI-only: this never builds or runs the `acquisition` app target (it links
# crashpad, whose signal handlers can conflict with the sanitizer's). Release
# packaging never sets ACQ_SANITIZE.

# Runs on release tags and on demand. On a pull request it runs only when the
# change touches the code this runner exercises (the worker, the API client,
# the rate-limit hub, the network manager) or the runner and its build
# themselves; that run is not a required check. Every other pull request is
# gated by the test suite (tests.yml) alone and is covered by the run on the
# next beta or release-candidate tag, which always precedes a final release.
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [master]
    paths:
      - 'src/ratelimit/**'
      - 'src/poe/poeapiclient.*'
      - 'src/itemsmanagerworker.*'
      - 'src/itemsfromwire.*'
      - 'src/util/networkmanager.*'
      - 'src/replytimeout.h'
      - 'tests/tst_workerintegration.cpp'
      - 'tests/fake*.h'
      - 'tests/lsan.supp'
      - 'tests/CMakeLists.txt'
      - 'CMakeLists.txt'
      - '.github/workflows/sanitizers.yml'
  workflow_dispatch:

# A newer commit on a pull request supersedes the run in progress; a run on
# a tag is allowed to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  asan-lsan:
    name: ASan + UBSan (suite), LSan (integration runner)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Qt
        # Normally 30 to 75 seconds. Without a limit, a runner that cannot
        # resolve the Ubuntu package hosts retries for about 47 minutes
        # (November 2026, PR 235: an upstream DNS failure for ubuntu.com).
        timeout-minutes: 5
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.12.0'
          modules: 'qtnetworkauth'
          cache: true
          cache-key-prefix: 'qt-6.12.0-linux-sanitizers'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openssl \
            libcurl4-openssl-dev \
            libgl-dev \
            libssl-dev \
            libvulkan-dev \
            libxcb-cursor0 \
            libxcb-cursor-dev \
            zlib1g-dev \
            llvm

      - name: Configure CMake (ASan + UBSan)
        run: cmake -B build-asan -S . -DACQ_SANITIZE=address,undefined -DCMAKE_BUILD_TYPE=RelWithDebInfo

      # Build ONLY the test targets (acq_tests: every executable ctest runs).
      # acquisition_core + sentry/crashpad compile under the sanitizers (a
      # heavy from-scratch build), but the `acquisition` app target must never
      # be sanitized. Allow generous build time.
      #
      # Cap at --parallel 2 (matching codeql.yml / build-linux.yml): ASan cc1plus
      # uses far more memory per translation unit than a plain build, so building
      # the heavy C++23/Qt TUs at full runner width (4 cores) exhausts RAM and
      # systemd-oomd kills the build cgroup with SIGTERM (exit 143). Two-wide
      # keeps peak memory well under the runner's limit.
      - name: Build test targets
        id: build
        run: cmake --build build-asan --target acq_tests --parallel 2

      # The scenarios split into two leak regimes, and they are run as two
      # separate steps so the suppression file only ever applies where it is
      # justified. tests/lsan.supp matches allocation-stack frames (the per-fetch
      # and hub coroutines), so applied globally it would silence ANY leak
      # allocated beneath those coroutines -- including in a scenario that is
      # supposed to be leak-clean. Splitting keeps the suppression off the
      # scenarios that must exit clean, so a regression there fails the job
      # instead of being masked.
      #
      # detect_leaks=1 is the Linux default under ASan; set it explicitly.
      # abort_on_error=1 makes any ASan/LSan report fail the process (and the
      # test). llvm-symbolizer (from the llvm apt package) gives symbolized leak
      # stacks that the leak: substrings match. -V (not --output-on-failure)
      # surfaces LSan's accounting on every run: passing scenarios would
      # otherwise hide it.

      # Non-shutdown scenarios run to completion and leave NO detached frames, so
      # they must exit leak-clean with NO suppression file at all. If any of them
      # leaks -- even through a coroutine frame the suppression would have matched
      # -- LSan fails the job. That is the blind spot the global suppression used
      # to hide.
      - name: Run leak-clean scenarios (no suppressions)
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
        run: |
          ctest --test-dir build-asan --no-tests=error -R tst_workerintegration -E 'i_shut_|i_leak_bound' -V

      # Shutdown scenarios (i_shut_*) and the bounded-leak proof (i_leak_bound)
      # intentionally leave detached QCoro frames at process exit (S1-1/S1-2), so
      # they -- and only they -- run with the suppression file. print_suppressions=1
      # prints the accounting so the tight closure stays visible; a leak whose
      # stack falls outside the closure is unmatched and still fails the job.
      - name: Run shutdown scenarios (detached-frame suppressions)
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp:print_suppressions=1
        run: |
          ctest --test-dir build-asan --no-tests=error -R 'tst_workerintegration\.(i_shut_|i_leak_bound)' -V

      # Every other test, under ASan + UBSan with leak detection off: their
      # leaks have not been measured, and the suppression file must never be
      # applied to them. Runs even when a leak step above failed (but not
      # when the build did), so one run reports both.
      - name: Run the rest of the suite (no leak detection)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          ctest --test-dir build-asan --no-tests=error -E '^tst_workerintegration\.' --output-on-failure
